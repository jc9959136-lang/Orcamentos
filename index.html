<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>João Orçamentos</title><style>:root{font-family:Arial,sans-serif;color:#f3f5f7;background:#0e1117}*{box-sizing:border-box}body{margin:0}header{background:#171b22;padding:18px;display:flex;gap:15px;align-items:center;position:sticky;top:0;z-index:2}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:12px;background:#12c784;color:#06130d;font-weight:bold;cursor:pointer}.menu{background:transparent;color:white;font-size:24px}.brand{font-size:20px;font-weight:bold}.drawer{position:fixed;inset:0 18% 0 0;background:#151515;z-index:5;padding:20px;overflow:auto;box-shadow:0 0 0 100vmax #0009;display:none}.drawer.show{display:block}.drawer button{display:block;background:transparent;color:#ccc;text-align:left;width:100%;margin:8px 0;padding:15px}.close{float:right}main{padding:18px;max-width:900px;margin:auto}h2{font-size:22px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel,.item{background:#1a202a;border:1px solid #303743;border-radius:15px;padding:16px;margin-bottom:14px}.card small{color:#aeb7c3}.card strong{display:block;font-size:23px;margin-top:10px;color:#3ae7a5}.panel{margin-top:18px}label{display:block;color:#bac4d0;margin:12px 0 5px}input,select,textarea{background:#0d1219;color:white;border:1px solid #404a57;border-radius:9px;padding:12px;width:100%}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.muted{color:#aab4c1;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{padding:9px;font-size:13px}.secondary{background:#333e4b;color:white}.danger{background:#9f3038;color:white}.hide{display:none!important}.pill{display:inline-block;padding:5px 9px;background:#304333;border-radius:20px;color:#aaf5c8;font-size:12px}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#121820}nav button{white-space:nowrap;background:#293341;color:#eee} .service-line{border:1px solid #3c4b55;border-radius:12px;padding:12px;margin:12px 0;background:#111923}.service-line .row{margin-top:8px}.totals{padding:14px;background:#12352c;border-radius:12px;margin-top:12px}.totals b{color:#50f3b5}.mini{padding:8px!important}.search{margin-bottom:14px}</style></head><body><header><button class="menu" onclick="toggle()">☰</button><span class="brand">🟢 João Orçamentos</span></header><aside id="drawer" class="drawer"><button class="close" onclick="toggle()">✕</button><h2>Ⓜ João Orçamentos</h2><div id="links"></div></aside><nav><button onclick="go('Dashboard')">Dashboard</button><button onclick="go('Orçamentos')">Orçamentos</button><button onclick="go('Clientes')">Clientes</button><button onclick="go('Financeiro')">Financeiro</button><button onclick="go('Materiais')">Materiais</button></nav><main id="app"></main><script>
const pages=['Dashboard','Solicitações','Financeiro','Indicações','Afiliados','Clientes','O.S','Templates','Catálogo','Calculadora','Avaliações','Assinatura','Meu Perfil','Orçamentos','Materiais'];let db=JSON.parse(localStorage.getItem('joao_orcamentos_v1')||'{"clientes":[],"orcamentos":[],"servicos":[],"solicitacoes":[]}');db.os ||= []; db.materiais ||= []; db.regrasMateriais ||= [];  let page='Dashboard',editing=-1; let linhas=[];let materiaisEdicao=[];let materiaisManual=false;const $=x=>document.getElementById(x),money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('joao_orcamentos_v1',JSON.stringify(db))}function toggle(){$('drawer').classList.toggle('show')}function go(p){page=p;editing=-1;linhas=[];materiaisEdicao=[];materiaisManual=false;$('drawer').classList.remove('show');render()}$('links').innerHTML=pages.map(p=>`<button onclick="go('${p}')">${({'Dashboard':'▦','Financeiro':'＄','Clientes':'♧','O.S':'🔧','Catálogo':'◇','Calculadora':'▣'})[p]||'◈'} &nbsp; ${p}</button>`).join('');function stats(){let total=db.orcamentos.reduce((a,o)=>a+Number(o.valor||0),0),paid=db.orcamentos.reduce((a,o)=>a+Number(o.pago||0),0);return {total,paid,rest:total-paid}}function render(){let s=stats(),h=`<h2>${page}</h2>`;if(page==='Dashboard'){h+=`<div class="cards"><div class="card"><small>Total orçado</small><strong>${money(s.total)}</strong></div><div class="card"><small>Recebido</small><strong>${money(s.paid)}</strong></div><div class="card"><small>A receber</small><strong>${money(s.rest)}</strong></div><div class="card"><small>Clientes</small><strong>${db.clientes.length}</strong></div></div><div class="panel"><h3>Acesso rápido</h3><div class="actions"><button onclick="go('Orçamentos')">+ Orçamento</button><button onclick="go('Clientes')">+ Cliente</button><button onclick="go('O.S')">Ordens de serviço</button></div></div>`;h+=listOrc(false)}else if(page==='Clientes'){h+=`<div class="panel"><h3>${editing>=0?'Editar':'Novo'} cliente</h3><form onsubmit="addCliente(event)"><label>Nome</label><input id="nome" required><label>WhatsApp com DDD</label><input id="telefone" type="tel"><label>Endereço</label><input id="endereco"><button style="margin-top:14px">Salvar cliente</button></form></div>`+db.clientes.map((c,i)=>`<div class="item"><b>${safe(c.nome)}</b><p class="muted">${safe(c.telefone)} · ${safe(c.endereco)}</p><div class="actions"><button class="secondary" onclick="editCliente(${i})">Editar</button><button class="danger" onclick="remove('clientes',${i})">Excluir</button></div></div>`).join('')}else if(['Orçamentos','O.S'].includes(page)){let isOS=page==='O.S';h+=`<div class="panel"><h3>${editing>=0?'Editar':'Nova'} ${isOS?'ordem de serviço':'orçamento'}</h3><form onsubmit="addOrc(event)"><label>Cliente</label><select id="cliente" required><option value="">Selecione</option>${db.clientes.map(c=>`<option>${safe(c.nome)}</option>`).join('')}</select><label>Serviços da ${isOS?'O.S.':'obra'} (múltiplos itens)</label><div id="linhas"></div><div class="actions"><button type="button" onclick="addLinha()">+ Adicionar serviço</button><button type="button" class="secondary" onclick="addLinha(true)">+ Serviço do catálogo</button></div><div class="totals" id="resumoLinhas"></div><div class="panel"><h3>🧱 Lista automática de materiais</h3><p class="muted">Gerada pelos serviços e quantidades. Configure materiais por unidade de serviço na aba Materiais.</p><div id="prevMateriais"></div><div class="actions"><button type="button" onclick="adicionarMaterial()">+ Material manual</button><button type="button" class="secondary" onclick="recalcularMateriais()">↻ Recalcular lista automática</button></div></div><div class="row"><div><label>Sinal / recebido (R$)</label><input id="pago" type="number" min="0" step="0.01" value="0" oninput="resumo()" required></div><div><label>Data</label><input type="date" id="data" required></div></div><label>Status</label><select id="status"><option>Orçamento</option><option>Em andamento</option><option>Concluído</option><option>Pago</option><option>Cancelado</option></select><label>Observações</label><textarea id="observacoes" rows="2"></textarea><button style="margin-top:15px">Salvar ${isOS?'O.S.':'orçamento'}</button></form></div>`+listOrc(true,isOS)}else if(page==='Financeiro'){h+=`<div class="cards"><div class="card"><small>Orçado</small><strong>${money(s.total)}</strong></div><div class="card"><small>Recebido</small><strong>${money(s.paid)}</strong></div><div class="card"><small>Restante</small><strong>${money(s.rest)}</strong></div><div class="card"><small>Obras</small><strong>${db.orcamentos.length}</strong></div></div>`+listOrc(false)}else if(page==='Catálogo'){h+=`<div class="panel"><h3>${editing>=0?'Editar serviço':'Cadastrar serviço'}</h3><form onsubmit="addServico(event)"><label>Nome do serviço</label><input id="servico" required><label>Categoria</label><input id="categoria" placeholder="Ex.: Alvenaria, pintura, pisos"><div class="row"><div><label>Unidade</label><select id="unidade"><option>m²</option><option>m</option><option>un</option><option>diária</option><option>hora</option><option>serviço</option></select></div><div><label>Preço unitário (R$)</label><input id="preco" type="number" step="0.01" min="0" required></div></div><label>Descrição</label><textarea id="detalhes" rows="2"></textarea><button style="margin-top:12px">Salvar serviço</button></form></div><input class="search" id="buscaServico" placeholder="🔎 Buscar serviço ou categoria" oninput="listaCatalogo()"><div id="listaCatalogo"></div>`}else if(page==='Materiais'){h+=`<div class="panel"><h3>Regras de materiais por serviço</h3><p class="muted">Exemplo: para 1 m² de reboco, informe 0,02 saco de cimento. Ao usar o serviço no orçamento, a lista é calculada automaticamente.</p><form onsubmit="salvarRegra(event)"><label>Serviço do catálogo</label><select id="regServico" required><option value="">Selecione</option>${db.servicos.map((x,i)=>`<option value="${i}">${safe(x.nome)} (${safe(x.unidade)})</option>`).join('')}</select><label>Material</label><input id="regMaterial" required placeholder="Ex.: Cimento CP II"><div class="row"><div><label>Quantidade por unidade de serviço</label><input id="regQtd" type="number" min="0.0001" step="any" required></div><div><label>Unidade do material</label><select id="regUnidade"><option>saco</option><option>kg</option><option>m³</option><option>m²</option><option>litro</option><option>un</option><option>barra</option><option>lata</option></select></div></div><button>+ Salvar regra</button></form></div>`+db.regrasMateriais.map((r,i)=>`<div class="item"><b>${safe(r.material)}</b><p>${safe(db.servicos[r.servico]?.nome||'Serviço excluído')} — ${r.qtd} ${safe(r.unidade)} por unidade</p><button class="danger" onclick="remove('regrasMateriais',${i})">Excluir</button></div>`).join('')}else if(page==='Calculadora'){h+=`<div class="panel"><label>Quantidade</label><input id="q" type="number" value="1" oninput="calc()"><label>Preço unitário</label><input id="v" type="number" value="0" oninput="calc()"><label>Sinal (%)</label><input id="pct" type="number" value="30" oninput="calc()"><h3 id="resultado"></h3></div>`}else if(page==='Solicitações'){h+=`<div class="panel"><form onsubmit="addSolicitacao(event)"><label>Solicitação do cliente</label><textarea id="pedido" required></textarea><button>Salvar solicitação</button></form></div>`+db.solicitacoes.map((x,i)=>`<div class="item">${safe(x)} <button class="danger" onclick="remove('solicitacoes',${i})">Excluir</button></div>`).join('')}else if(page==='Meu Perfil'){h+=`<div class="panel"><h3>João Orçamentos</h3><p>Os dados ficam salvos neste navegador.</p><button onclick="exportar()">Exportar backup JSON</button> <label>Importar backup</label><input type="file" accept="application/json" onchange="importar(event)"></div>`}else{h+=`<div class="panel"><p>Área ${safe(page)}. Módulo demonstrativo, sem integração externa.</p></div>`} $('app').innerHTML=h;if(page==='Calculadora')calc();if(['Orçamentos','O.S'].includes(page)){$('data').value=new Date().toISOString().slice(0,10);if(!linhas.length)addLinha();else renderLinhas()}if(page==='Catálogo'){listaCatalogo();if(editing>=0){let x=db.servicos[editing];$('servico').value=x.nome;$('categoria').value=x.categoria||'';$('unidade').value=x.unidade||'un';$('preco').value=x.preco;$('detalhes').value=x.detalhes||''}}}function listOrc(actions,isOS=false){let arr=isOS?db.os:db.orcamentos;return '<h3>'+(isOS?'Ordens de serviço':'Orçamentos')+'</h3>'+(!arr.length?'<p class="muted">Nenhum registro cadastrado.</p>':'')+arr.map((o,i)=>`<div class="item"><b>#${i+1} · ${safe(o.cliente)}</b> <span class="pill">${safe(o.status)}</span><p>${(o.itens||[]).map(x=>`${safe(x.nome)} — ${x.qtd} ${safe(x.unidade)} × ${money(x.preco)} = ${money(x.qtd*x.preco)}`).join('<br>')||safe(o.descricao)}</p><p>${(o.materiais||[]).length?'<b>Materiais:</b> '+o.materiais.map(m=>safe(m.nome)+' '+Number(m.qtd.toFixed(3))+' '+safe(m.unidade)).join(', '):''}</p><p>Total: <b>${money(o.valor)}</b> · Sinal: <b>${money(o.pago)}</b><br>Restante: <b>${money(o.valor-o.pago)}</b> · ${safe(o.data)}</p><div class="actions"><button onclick="compartilhar(${i},${isOS})">📲 Enviar orçamento pelo WhatsApp</button><button class="secondary" onclick="enviarPDF(${i},${isOS})">📄 Enviar PDF pelo WhatsApp</button><button class="secondary" onclick="imprimir(${i},${isOS})">Imprimir/PDF</button>${actions?`<button class="secondary" onclick="editOrc(${i},${isOS})">Editar</button><button class="danger" onclick="remove('${isOS?'os':'orcamentos'}',${i})">Excluir</button>`:''}</div></div>`).join('')}
function addLinha(catalogo=false){linhas.push({nome:'',qtd:1,unidade:'m²',preco:0});renderLinhas();if(catalogo&&db.servicos.length){let sel=document.querySelector('#linhas .service-line:last-child select');if(sel)sel.focus()}}
function renderLinhas(){let el=$('linhas');if(!el)return;el.innerHTML=linhas.map((x,i)=>`<div class="service-line"><div class="row"><b>Serviço ${i+1}</b><button type="button" class="danger mini" onclick="linhas.splice(${i},1);renderLinhas()">Remover</button></div><label>Selecionar do catálogo</label><select onchange="usarCatalogo(${i},this.value)"><option value="">Escolher ou preencher manualmente</option>${db.servicos.map((v,j)=>`<option value="${j}">${safe(v.nome)} — ${money(v.preco)}/${safe(v.unidade||'un')}</option>`).join('')}</select><label>Descrição</label><input value="${safe(x.nome)}" oninput="linhaSet(${i},'nome',this.value)"><div class="row"><div><label>Quantidade</label><input type="number" min="0.01" step="0.01" value="${x.qtd}" oninput="linhaSet(${i},'qtd',this.value)"></div><div><label>Unidade</label><select onchange="linhaSet(${i},'unidade',this.value)">${['m²','m','un','diária','hora','serviço'].map(u=>`<option ${u===x.unidade?'selected':''}>${u}</option>`).join('')}</select></div></div><label>Valor unitário (R$)</label><input type="number" min="0" step="0.01" value="${x.preco}" oninput="linhaSet(${i},'preco',this.value)"><p class="muted">Subtotal: <b id="sub${i}">${money(x.qtd*x.preco)}</b></p></div>`).join('');resumo()}
function linhaSet(i,k,v){linhas[i][k]=['qtd','preco'].includes(k)?+v:v;let el=$('sub'+i);if(el)el.textContent=money(linhas[i].qtd*linhas[i].preco);resumo()}
function usarCatalogo(i,j){if(j==='')return;let x=db.servicos[+j];linhas[i]={nome:x.nome,qtd:1,unidade:x.unidade||'un',preco:+x.preco};renderLinhas()}
function calcularMateriais(itens){let m=new Map();(itens||[]).forEach(x=>{let idx=db.servicos.findIndex(s=>s.nome===x.nome&&s.unidade===x.unidade);db.regrasMateriais.filter(r=>r.servico===idx&&idx>=0).forEach(r=>{let k=r.material.trim().toLowerCase()+'|'+r.unidade;let old=m.get(k)||{nome:r.material,unidade:r.unidade,qtd:0};old.qtd+=Number(r.qtd)*Number(x.qtd);m.set(k,old)})});return [...m.values()]};function salvarRegra(e){e.preventDefault();db.regrasMateriais.push({servico:+$('regServico').value,material:$('regMaterial').value.trim(),qtd:+$('regQtd').value,unidade:$('regUnidade').value});save();render()};function resumo(){let t=linhas.reduce((a,x)=>a+(+x.qtd||0)*(+x.preco||0),0),p=+$('pago')?.value||0;if($('prevMateriais')){if(!materiaisManual){materiaisEdicao=calcularMateriais(linhas)}renderMateriais()}if($('resumoLinhas'))$('resumoLinhas').innerHTML=`Total: <b>${money(t)}</b><br>Sinal recebido: ${money(p)}<br>Restante: <b>${money(t-p)}</b>`}
function renderMateriais(){let el=$('prevMateriais');if(!el)return;el.innerHTML=materiaisEdicao.length?materiaisEdicao.map((m,i)=>`<div class="service-line"><div class="row"><b>Material ${i+1}</b><button type="button" class="danger mini" onclick="removerMaterial(${i})">Excluir</button></div><label>Nome do material</label><input value="${safe(m.nome)}" oninput="editarMaterial(${i},'nome',this.value)"><div class="row"><div><label>Quantidade</label><input type="number" min="0" step="any" value="${m.qtd}" oninput="editarMaterial(${i},'qtd',this.value)"></div><div><label>Unidade</label><input value="${safe(m.unidade)}" oninput="editarMaterial(${i},'unidade',this.value)"></div></div></div>`).join(''):'<p class="muted">Lista vazia. Adicione materiais manualmente ou recalcule.</p>'}function editarMaterial(i,k,v){materiaisManual=true;materiaisEdicao[i][k]=k==='qtd'?Math.max(0,Number(v)||0):v}function adicionarMaterial(){materiaisManual=true;materiaisEdicao.push({nome:'',qtd:1,unidade:'un'});renderMateriais()}function removerMaterial(i){materiaisManual=true;materiaisEdicao.splice(i,1);renderMateriais()}function recalcularMateriais(){if(materiaisManual&&materiaisEdicao.length&&!confirm('Substituir a lista editada pela lista automática?'))return;materiaisManual=false;materiaisEdicao=calcularMateriais(linhas);renderMateriais()}
function listaCatalogo(){let q=($('buscaServico')?.value||'').toLowerCase();$('listaCatalogo').innerHTML=db.servicos.map((x,i)=>({...x,i})).filter(x=>(x.nome+' '+(x.categoria||'')).toLowerCase().includes(q)).map(x=>`<div class="item"><b>${safe(x.nome)}</b><span class="pill">${safe(x.categoria||'Geral')}</span><p>${money(x.preco)} / ${safe(x.unidade||'un')}</p><p class="muted">${safe(x.detalhes||'')}</p><div class="actions"><button class="secondary" onclick="editing=${x.i};render()">Editar</button><button class="danger" onclick="remove('servicos',${x.i})">Excluir</button></div></div>`).join('')||'<p class="muted">Nenhum serviço encontrado.</p>'}
function addCliente(e){e.preventDefault();let c={nome:$('nome').value,telefone:$('telefone').value,endereco:$('endereco').value};if(editing>=0)db.clientes[editing]=c;else db.clientes.push(c);save();go('Clientes')}function editCliente(i){editing=i;let c=db.clientes[i];$('nome').value=c.nome;$('telefone').value=c.telefone;$('endereco').value=c.endereco;scrollTo(0,0)}function addOrc(e){e.preventDefault();let itens=linhas.filter(x=>x.nome.trim()&&x.qtd>0);if(!itens.length){alert('Adicione pelo menos um serviço com descrição e quantidade.');return}let valor=itens.reduce((a,x)=>a+x.qtd*x.preco,0),pago=+$('pago').value;if(pago>valor){alert('O sinal não pode ultrapassar o total.');return}let o={cliente:$('cliente').value,itens,descricao:itens.map(x=>x.nome).join(', '),valor,pago,status:$('status').value,data:$('data').value,observacoes:$('observacoes').value,materiais:(materiaisManual?materiaisEdicao:calcularMateriais(itens)).filter(m=>m.nome.trim()&&Number(m.qtd)>=0).map(m=>({...m}))};let k=page==='O.S'?'os':'orcamentos';if(editing>=0)db[k][editing]=o;else db[k].push(o);save();go(page)}function editOrc(i,isOS){editing=i;let o=(isOS?db.os:db.orcamentos)[i];$('cliente').value=o.cliente;$('pago').value=o.pago;$('status').value=o.status;$('data').value=o.data;$('observacoes').value=o.observacoes||'';materiaisEdicao=(o.materiais||[]).map(m=>({...m}));materiaisManual=true;linhas=(o.itens?.length?o.itens:[{nome:o.descricao,qtd:1,unidade:'serviço',preco:o.valor}]).map(x=>({...x}));renderLinhas();scrollTo(0,0)}function remove(k,i){if(confirm('Excluir este registro?')){db[k].splice(i,1);save();render()}}function addServico(e){e.preventDefault();let x={nome:$('servico').value,categoria:$('categoria').value,unidade:$('unidade').value,preco:+$('preco').value,detalhes:$('detalhes').value};if(editing>=0)db.servicos[editing]=x;else db.servicos.push(x);save();editing=-1;render()}function addSolicitacao(e){e.preventDefault();db.solicitacoes.push($('pedido').value);save();render()}function calc(){let t=(+$('q').value||0)*(+$('v').value||0),s=t*(+$('pct').value||0)/100;$('resultado').textContent=`Total ${money(t)} · Sinal ${money(s)} · Restante ${money(t-s)}`}function mensagem(i,isOS=false){let o=(isOS?db.os:db.orcamentos)[i];return `JOÃO ORÇAMENTOS — ${isOS?'O.S.':'ORÇAMENTO'} #${i+1}\nCliente: ${o.cliente}\nServiços:\n${(o.itens||[]).map(x=>`${x.nome}: ${x.qtd} ${x.unidade} x ${money(x.preco)} = ${money(x.qtd*x.preco)}`).join('\n')||o.descricao}\nTotal: ${money(o.valor)}\nSinal recebido: ${money(o.pago)}\nRestante: ${money(o.valor-o.pago)}\nStatus: ${o.status}\nData: ${o.data}\nObservações: ${o.observacoes||'-'}`}function compartilhar(i,isOS=false){let o=(isOS?db.os:db.orcamentos)[i];let c=db.clientes.find(c=>c.nome===o.cliente);let tel=(c?.telefone||'').replace(/\D/g,'');if(tel.length===10||tel.length===11)tel='55'+tel;let url='https://wa.me/'+tel+'?text='+encodeURIComponent(mensagem(i,isOS));let a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}function pdfTexto(i,isOS){let o=(isOS?db.os:db.orcamentos)[i], linhas=[`JOAO ORCAMENTOS - ${isOS?'ORDEM DE SERVICO':'ORCAMENTO'} #${i+1}`,`Cliente: ${o.cliente}`,`Data: ${o.data}`,`Status: ${o.status}`,'','SERVICOS'];(o.itens||[]).forEach((x,n)=>{linhas.push(`${n+1}. ${x.nome}`,`   ${x.qtd} ${x.unidade} x ${money(x.preco)} = ${money(x.qtd*x.preco)}`)});linhas.push('','MATERIAIS ESTIMADOS:',...(o.materiais||[]).map(m=>m.nome+': '+Number(m.qtd.toFixed(3))+' '+m.unidade),'','TOTAL: '+money(o.valor),'SINAL RECEBIDO: '+money(o.pago),'SALDO RESTANTE: '+money(o.valor-o.pago),'','OBSERVACOES:',o.observacoes||'-');return linhas}
function gerarPDF(i,isOS){
 const o=(isOS?db.os:db.orcamentos)[i], client=db.clientes.find(c=>c.nome===o.cliente)||{};
 const W=595,H=842, left=42,right=553;let pages=[],ops=[],y=0;
 const clean=t=>String(t??'').replace(/R\$/g,'R$').replace(/[–—−]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,'...').replace(/²/g,'2').replace(/³/g,'3').replace(/º/g,'o').replace(/ª/g,'a').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,' ').replace(/[\\()]/g,'\\$&');
 const txt=(t,x,yy,size=10,bold=false,color='0.15 0.19 0.24')=>{ops.push(`${color} rg BT /${bold?'F2':'F1'} ${size} Tf 1 0 0 1 ${x} ${yy} Tm (${clean(t)}) Tj ET`)};
 const line=(x1,y1,x2,y2,color='0.83 0.86 0.89',thick=.6)=>ops.push(`${color} RG ${thick} w ${x1} ${y1} m ${x2} ${y2} l S`);
 const rect=(x,yy,w,h,color)=>ops.push(`${color} rg ${x} ${yy} ${w} ${h} re f`);
 const truncate=(t,max)=>{t=String(t??'');return t.length>max?t.slice(0,max-3)+'...':t};
 function begin(){ops=[];rect(0,0,W,H,'1 1 1');rect(0,758,W,84,'0.07 0.15 0.18');rect(42,778,48,45,'0.13 0.65 0.43');
 // Logo vetorial de capacete e colher de pedreiro
 ops.push('1 1 1 RG 2 w 50 792 m 82 792 l S 55 794 m 55 804 60 810 66 810 c 72 810 77 804 77 794 c S 65 811 m 65 816 l S');
 txt('JOAO PEDREIRO',101,801,21,true,'1 1 1');txt('ORCAMENTOS E SERVICOS DE CONSTRUCAO',102,784,9,false,'0.78 0.91 0.85');
 txt(isOS?'ORDEM DE SERVICO':'ORCAMENTO',42,731,17,true);txt('#'+String(i+1).padStart(4,'0'),495,731,13,true,'0.08 0.49 0.32');line(42,716,553,716,'0.13 0.65 0.43',2);
 txt('CLIENTE',42,693,8,true,'0.38 0.44 0.48');txt(truncate(o.cliente,45),42,677,12,true);
 txt('DATA',375,693,8,true,'0.38 0.44 0.48');txt(o.data||'-',375,677,11);
 txt('STATUS',475,693,8,true,'0.38 0.44 0.48');txt(truncate(o.status,13),475,677,9);
 if(client.endereco)txt('Endereco: '+truncate(client.endereco,83),42,655,9);
 if(client.telefone)txt('Contato: '+truncate(client.telefone,28),42,640,9);
 y=client.endereco||client.telefone?610:645;}
 function nextIf(h){if(y-h<88){pages.push(ops.join('\n'));begin();y=615;}}
 function heading(t){nextIf(44);rect(left,y-9,right-left,27,'0.91 0.96 0.93');txt(t,left+10,y,11,true,'0.08 0.38 0.28');y-=39;}
 function row(cells,widths,header=false){nextIf(34);if(header)rect(left,y-18,right-left,26,'0.91 0.93 0.94');let x=left;cells.forEach((v,j)=>{txt(truncate(v,Math.max(8,Math.floor(widths[j]/5.7))),x+6,y-8,header?8:9,header,'0.19 0.26 0.29');x+=widths[j];if(j<cells.length-1)line(x,y+8,x,y-22)});line(left,y-23,right,y-23);y-=32;}
 begin();heading('SERVICOS E MAO DE OBRA');row(['SERVICO','QTD','UN.','VALOR UNIT.','SUBTOTAL'],[209,54,47,99,102],true);
 (o.itens||[]).forEach(x=>row([x.nome,String(x.qtd),x.unidade,money(x.preco),money(x.qtd*x.preco)],[209,54,47,99,102]));
 if((o.materiais||[]).length){y-=15;heading('LISTA DE MATERIAIS');row(['MATERIAL','QUANTIDADE','UNIDADE'],[305,110,96],true);o.materiais.forEach(m=>row([m.nome,String(Number(m.qtd).toFixed(3)).replace(/\.?0+$/,''),m.unidade],[305,110,96]));}
 nextIf(175);y-=17;heading('RESUMO FINANCEIRO');
 const val=(label,v,col)=>{txt(label,50,y,10);txt(v,410,y,11,true,col);line(42,y-11,553,y-11);y-=28};
 val('VALOR TOTAL DA OBRA',money(o.valor),'0.08 0.38 0.28');val('SINAL / VALOR RECEBIDO',money(o.pago),'0.08 0.38 0.28');val('SALDO RESTANTE',money(o.valor-o.pago),'0.65 0.19 0.12');
 nextIf(75);rect(42,y-48,511,59,'0.91 0.96 0.93');txt('PAGAMENTO VIA PIX',53,y-6,9,true,'0.08 0.38 0.28');txt('CHAVE PIX: 12981325084',53,y-28,13,true);y-=70;
 if(o.observacoes){heading('OBSERVACOES');const words=String(o.observacoes).split(/\s+/);let cur='';for(const word of words){if((cur+' '+word).length>88){nextIf(19);txt(cur,46,y,9);y-=16;cur=word}else cur+=(cur?' ':'')+word;}if(cur){nextIf(19);txt(cur,46,y,9);y-=16;}}
 pages.push(ops.join('\n'));
 // Monta PDF com paginas, fontes e streams ASCII, sem depender da internet.
 let objects=['','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'];
 const kids=[];pages.forEach(content=>{let pageId=objects.length+1,streamId=pageId+1;kids.push(`${pageId} 0 R`);objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${streamId} 0 R >>`);objects.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`)});
 objects[0]='<< /Type /Catalog /Pages 2 0 R >>';objects[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;
 let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((obj,j)=>{offsets.push(pdf.length);pdf+=`${j+1} 0 obj\n${obj}\nendobj\n`});let xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;offsets.slice(1).forEach(n=>pdf+=String(n).padStart(10,'0')+' 00000 n \n');pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
 return new Blob([pdf],{type:'application/pdf'});
}
async function enviarPDF(i,isOS=false){let blob=gerarPDF(i,isOS),nome=`Joao_${isOS?'OS':'Orcamento'}_${i+1}.pdf`,file=new File([blob],nome,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Orcamento em PDF'});return}catch(e){if(e.name==='AbortError')return}}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);alert('PDF salvo. Abra o arquivo em Downloads e use Compartilhar > WhatsApp para enviar ao cliente.')}
function imprimir(i,isOS=false){let w=window.open('','_blank');if(!w){alert('Permita pop-ups para imprimir');return}w.document.write('<html><meta charset="utf-8"><title>Orçamento</title><body style="font:18px Arial;padding:25px"><h2>JOÃO ORÇAMENTOS</h2><pre style="white-space:pre-wrap;font:17px Arial">'+safe(mensagem(i,isOS))+'</pre><script>window.print()<\/script></body></html>');w.document.close()}function exportar(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='joao-orcamentos-backup.json';a.click();URL.revokeObjectURL(a.href)}function importar(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.clientes)||!Array.isArray(x.orcamentos))throw Error();db=x;db.servicos||=[];db.solicitacoes||=[];db.os||=[];db.regrasMateriais||=[];save();render()}catch{alert('Arquivo inválido')}};r.readAsText(f)}render();</script></body></html>
